# Infraestructura local opcional. Backend/frontend se ejecutan con docs/TESTING.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: liquidity
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidity"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres_data:
