<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Horizonte · Conectar</title>
<style>body{font:18px 'Segoe UI',sans-serif;background:#f4f6f2;color:#193b33;margin:0;padding:10vh 12vw}main{max-width:680px}h1{font-size:42px}label{display:block;margin-top:32px}input{box-sizing:border-box;width:100%;padding:16px;font-size:18px;border:1px solid #bccdc1;border-radius:10px;margin:12px 0}button{background:#215f4e;color:white;border:0;border-radius:10px;padding:15px 28px;font-size:18px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b57c28;outline-offset:3px}#error{color:#933b25;min-height:30px}p{line-height:1.6}</style>
<main><h1>Horizonte</h1><p>Conecta la aplicación con tu servidor para acceder a tus empresas, movimientos y pronósticos.</p><form id="form"><label for="server">Dirección del servidor</label><input id="server" type="url" placeholder="https://horizonte.example.com" required autocomplete="off"><button id="connect">Conectar</button><p id="error" role="alert"></p></form><p>Esta aplicación necesita conexión a internet. Docker no es necesario en este equipo.</p></main>
<script src="setup.js"></script>
</html>
